<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAROID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{background:#000;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;letter-spacing:.03em;overflow:hidden}
input{-webkit-user-select:text;user-select:text}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
.hide{display:none!important}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px;flex:none}
button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.75);border-radius:2px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button.on{background:#fff;color:#000;border-color:#fff}
button.primary{background:#fff;color:#000;border-color:#fff}
button:disabled{opacity:.25}
.steps{display:flex;justify-content:center;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 0;font-size:11px;flex:none}
.steps span{opacity:.35}
.steps span.done{opacity:.6}
.steps span.on{opacity:1;border-bottom:1px solid #fff;padding-bottom:2px}
.steps em{width:12px;height:1px;background:rgba(255,255,255,.3)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
.frame{position:relative;border:1px solid #fff;overflow:hidden}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;background:rgba(255,255,255,.22)}
.err{position:absolute;padding:24px;text-align:center;line-height:1.9;opacity:.75;font-size:13px}

.ctl{flex:none}
.ctl.over{position:absolute;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.55) 60%,transparent)}
.modes{display:flex;justify-content:center;padding:2px 12px 0;flex:none}
.modes span{padding:8px 20px;font-size:13px;border-bottom:1px solid #fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-color:rgba(255,255,255,.35);font-size:12px;padding:8px 13px}
.chips button.on{border-color:#fff;background:#fff;color:#000}
.dialbox{height:64px;position:relative}
.dialbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.lens{display:flex;gap:9px;justify-content:center;align-items:center;padding:6px 12px 0;flex:none}
.lens button{width:48px;height:48px;border-radius:50%;padding:0;font-size:12px;border-color:rgba(255,255,255,.4)}
.lens button.on{background:#fff;color:#000}
.foot{display:flex;align-items:center;justify-content:space-between;padding:12px 24px calc(14px + env(safe-area-inset-bottom));flex:none}
.shutter{width:76px;height:76px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0}
.shutter:active{background:#fff}
.count{width:80px;font-size:12px;opacity:.65;letter-spacing:.1em;touch-action:manipulation;-webkit-touch-callout:none}
.count.dev{opacity:1}
.zside{width:80px;text-align:right;font-size:12px;opacity:.65}

.wrap{position:relative}
.wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{text-align:center;opacity:.55;font-size:12px;padding:8px 24px;line-height:1.7;flex:none}

/* caption step */
.capPanel{flex:none;max-height:56%;overflow-y:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#memo{display:block;width:100%;height:auto;touch-action:none;background:#fff}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.tools button{font-size:12px;padding:8px 12px}
.tools .dot{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.45)}
.tools .dot.on{border-color:#fff;outline:2px solid #fff;outline-offset:2px}
#capIn{flex:1 1 100%;background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font:inherit;padding:10px 2px;outline:none;text-align:center}
.sep{height:1px;background:rgba(255,255,255,.18);flex:none}

/* album */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px calc(16px + env(safe-area-inset-bottom));overflow:auto;flex:1;align-content:start}
.agrid img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#111;cursor:pointer}
.empty{flex:1;display:flex;align-items:center;justify-content:center;opacity:.5;font-size:13px;line-height:1.9;text-align:center}
.title{font-size:13px;opacity:.7;min-width:60px;text-align:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:120;display:flex;align-items:center;justify-content:center;padding:24px}
.mbox{background:#111;border:1px solid rgba(255,255,255,.5);padding:22px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;text-align:center}
.mbox b{font-weight:500;font-size:15px}
.mbox p{font-size:13px;opacity:.7;line-height:1.7}
.mbox input{background:transparent;border:none;border-bottom:1px solid #fff;color:#fff;font:inherit;font-size:20px;letter-spacing:.4em;text-align:center;padding:8px;outline:none}
.mbtn{display:flex;gap:8px;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;font-size:13px;border-radius:2px;opacity:0;transition:.25s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- ===== 1. CAMERA ===== -->
<div id="cam" class="view">
  <div class="steps" data-n="1"></div>
  <div class="bar">
    <button id="ratio">3:5</button>
    <button id="flip">FLIP</button>
    <button id="grid">GRID</button>
    <button id="albumBtn">ALBUM</button>
  </div>
  <div class="stage" id="camStage">
    <div class="frame" id="frame">
      <video id="v" autoplay playsinline muted></video>
      <div class="grid hide" id="gridLines"></div>
    </div>
    <div class="err hide" id="err"></div>
    <div class="ctl over" id="evStrip"><div class="dialbox" id="evDial"></div></div>
  </div>
  <div class="lens" id="lensRow"></div>
  <div class="foot">
    <span class="count" id="count">10 / 10</span>
    <button id="shot" class="shutter"></button>
    <span class="zside" id="zLabel">×1.0</span>
  </div>
</div>

<!-- ===== 2. ADJUST ===== -->
<div id="edit" class="view hide">
  <div class="steps" data-n="2"></div>
  <div class="bar">
    <button id="back">RETAKE</button>
    <button id="next" class="primary">다음 · 멘트 →</button>
  </div>
  <div class="stage" id="editStage"><div class="wrap" id="wrap"><canvas id="pv"></canvas></div></div>
  <div class="ctl">
    <div class="modes"><span>보정</span></div>
    <div class="chips" id="editChips"></div>
    <div class="dialbox" id="editDial"></div>
  </div>
</div>

<!-- ===== 3. CAPTION ===== -->
<div id="capv" class="view hide">
  <div class="steps" data-n="3"></div>
  <div class="bar">
    <button id="capBack">← 보정</button>
    <button id="capOk" class="primary">확정하기</button>
  </div>
  <div class="stage" id="capStage"><div class="wrap" id="wrap2"><canvas id="pv2"></canvas></div></div>
  <div class="capPanel">
    <canvas id="memo"></canvas>
    <div class="tools" id="toolRow">
      <button data-tool="pen">펜</button>
      <button data-tool="text" class="on">텍스트</button>
      <button data-tool="erase" id="eraseBtn" class="hide">지우개</button>
      <button id="undo" class="hide">되돌리기</button>
    </div>
    <div class="tools" id="optRow"></div>
    <div class="sep"></div>
    <div class="tools" id="metaRow">
      <button id="mDate" class="on">날짜</button>
      <button id="mTime" class="on">시간</button>
      <button id="mWx">날씨</button>
      <button id="mIcon">☀</button>
    </div>
    <div class="hint" id="capHint" style="padding:0"></div>
  </div>
</div>

<!-- ===== 4. OUTPUT / ALBUM VIEWER ===== -->
<div id="out" class="view hide">
  <div class="steps" data-n="4" id="outSteps"></div>
  <div class="bar">
    <button id="oBack" class="hide">← 앨범</button>
    <button id="dl" class="primary">다운로드</button>
    <button id="oAlbum">앨범</button>
    <button id="home">새 사진</button>
    <button id="del" class="hide">삭제</button>
  </div>
  <div class="stage"><img id="outImg" alt="polaroid" style="max-width:100%;max-height:100%;object-fit:contain"></div>
  <div class="hint" id="outHint"></div>
</div>

<!-- ===== ALBUM ===== -->
<div id="album" class="view hide">
  <div class="bar" style="padding-top:calc(14px + env(safe-area-inset-top));justify-content:space-between">
    <button id="aBack">← 카메라</button>
    <span class="title" id="albumCount"></span>
    <span style="width:80px"></span>
  </div>
  <div class="empty hide" id="albumEmpty">아직 확정한 사진이 없어요.<br>촬영 후 멘트까지 완료하면 여기에 저장됩니다.</div>
  <div class="agrid" id="albumGrid"></div>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" class="modal hide">
  <div class="mbox">
    <b id="mTitle"></b>
    <p id="mMsg"></p>
    <input id="mInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <div class="mbtn"><button id="mCancel">취소</button><button id="mOk" class="primary">확인</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DPR=Math.min(window.devicePixelRatio||1,3);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);};

/* ================= state ================= */
let portrait=true, facing='environment', stream=null, track=null, caps={}, shot=null, baked=null, shotTime=new Date();
let camZoom=1, zUnit=1, zMin=1, zMax=1, nativeZoom=false;
let camEV=0, hwEV=false;
let fx='ORIGINAL';
let adj={b:0,c:0,s:0,t:0,ti:0,z:100,grain:0,vig:0,fxAmt:100};
let metaOn={date:true,time:true,wx:false}, wxIcon='☀', wx=null;
let panX=.5, panY=.5;
/* caption */
let capText='', capFont='hand', capSize=1, capX=.5, capY=.4;
let strokes=[], penLayer=null, tool='text', penColor='#111111', penW=8, eraseW=40;
const PENCOLORS=['#111111','#d63a3a','#2a55d6','#2a9d5b'];
const PAD=60, BOT=300, LIMIT=10;
const DEV_PW='605605';
const dims=()=>portrait?{pw:960,ph:1600}:{pw:1600,ph:960};

/* ================= 화면 전환 / 단계 표시 ================= */
const VIEWS=['cam','edit','capv','out','album'];
function show(id){
  VIEWS.forEach(v=>$('#'+v).classList.toggle('hide',v!==id));
  requestAnimationFrame(()=>{layout();camDial.size();editDial.size();});
}
const STEPS=['촬영','보정','멘트','저장'];
$$('.steps').forEach(el=>{
  const n=+el.dataset.n;
  el.innerHTML=STEPS.map((s,i)=>'<span class="'+(i+1===n?'on':i+1<n?'done':'')+'">'+(i+1)+' '+s+'</span>').join('<em></em>');
});

/* ================= 모달 ================= */
function askModal({title,msg='',input=false,ok='확인',cancel='취소'}){
  return new Promise(res=>{
    const m=$('#modal'), inp=$('#mInput');
    $('#mTitle').textContent=title; $('#mMsg').textContent=msg;
    inp.classList.toggle('hide',!input); inp.value='';
    $('#mOk').textContent=ok; $('#mCancel').textContent=cancel;
    m.classList.remove('hide'); if(input) setTimeout(()=>inp.focus(),60);
    const close=v=>{m.classList.add('hide');$('#mOk').onclick=null;$('#mCancel').onclick=null;inp.onkeydown=null;res(v);};
    $('#mOk').onclick=()=>close(input?inp.value:true);
    $('#mCancel').onclick=()=>close(input?null:false);
    inp.onkeydown=e=>{if(e.key==='Enter')close(inp.value);};
  });
}

/* ================= 하루 제한 / 개발자 모드 ================= */
const today=()=>{const n=new Date();return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate();};
const isDev=()=>localStorage.getItem('pola_dev')==='1';
const used=()=>+(localStorage.getItem('pola_used_'+today())||0);
const setUsed=n=>{localStorage.setItem('pola_used_'+today(),Math.max(0,n));updateCount();};
function updateCount(){
  const c=$('#count');
  if(isDev()){c.textContent='DEV ∞';c.classList.add('dev');$('#shot').disabled=false;return;}
  c.classList.remove('dev');
  const left=LIMIT-used(); c.textContent=left+' / '+LIMIT; $('#shot').disabled=left<=0;
}
function setDev(on){localStorage.setItem('pola_dev',on?'1':'0');updateCount();toast(on?'개발자 모드 ON · 촬영 무제한':'개발자 모드 OFF · 하루 10장');}
async function devPress(){
  if(isDev()){setDev(false);return;}
  const v=await askModal({title:'개발자 모드',msg:'비밀번호를 입력하세요',input:true});
  if(v==null)return;
  if(v===DEV_PW) setDev(true); else toast('비밀번호가 올바르지 않습니다');
}
(()=>{ /* 남은 장수 표시를 1.5초 이상 길게 눌러야만 진입 (탭 진입 없음) */
  const c=$('#count'); let timer=null;
  c.addEventListener('pointerdown',()=>{clearTimeout(timer);timer=setTimeout(()=>{timer=null;devPress();},1500);});
  const end=()=>{clearTimeout(timer);timer=null;};
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,end));
  c.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* ================= 앨범 저장소 (IndexedDB) ================= */
let dbp=null;
const openDB=()=>dbp||(dbp=new Promise((res,rej)=>{
  const r=indexedDB.open('polaroid',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
}));
const dbTx=(mode,fn)=>openDB().then(d=>new Promise((res,rej)=>{
  const t=d.transaction('photos',mode), rq=fn(t.objectStore('photos'));
  t.oncomplete=()=>res(rq&&rq.result); t.onerror=t.onabort=()=>rej(t.error);
}));
const dbPut=r=>dbTx('readwrite',s=>s.put(r));
const dbAll=()=>dbTx('readonly',s=>s.getAll());
const dbDel=id=>dbTx('readwrite',s=>s.delete(id));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ================= 색 보정 헬퍼 ================= */
function wbColor(K){
  const d=clamp((K-5500)/3500,-1,1), a=Math.abs(d);
  if(d>=0) return 'rgb(255,'+Math.round(255-a*26)+','+Math.round(255-a*118)+')';
  return 'rgb('+Math.round(255-a*118)+','+Math.round(255-a*34)+',255)';
}
const wbLift=K=>1+Math.abs(clamp((K-5500)/3500,-1,1))*0.13;
function tintColor(t){
  const a=Math.abs(t)/50;
  return t>=0 ? 'rgb(255,'+Math.round(255-a*90)+',255)' : 'rgb('+Math.round(255-a*55)+',255,'+Math.round(255-a*55)+')';
}
const tintLift=t=>1+Math.abs(t)/50*0.08;
function paint(g,w,h,color,mode){g.save();g.globalCompositeOperation=mode;g.fillStyle=color;g.fillRect(0,0,w,h);g.restore();}

/* ================= 다이얼 ================= */
function Dial(host){
  const cv=document.createElement('canvas'); host.innerHTML=''; host.appendChild(cv);
  const g=cv.getContext('2d');
  let o=null, drag=null, W=0; const H=64;
  function size(){const r=host.getBoundingClientRect();if(!r.width)return;W=r.width;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);draw();}
  const upp=()=>o.list ? W/3.2 : (W*1.7)/(o.max-o.min);
  function draw(){
    g.clearRect(0,0,W,H);
    if(!o)return;
    const cx=W/2, p=upp();
    g.textAlign='center';
    if(o.list){
      o.list.forEach((it,i)=>{
        const x=cx+(i-o.idx)*p; if(x<-100||x>W+100)return;
        const near=Math.abs(i-o.idx);
        g.globalAlpha=clamp(1-near*0.42,.22,1);
        g.fillStyle='#fff'; g.font=(near<.3?'500 ':'400 ')+'13px "Noto Sans KR",sans-serif';
        g.fillText(it,x,H/2+6);
      });
      g.globalAlpha=1;
    }else{
      let tick=o.step; while(tick*p<11) tick*=2;
      const span=(cx+50)/p;
      const first=Math.ceil((o.value-span)/tick)*tick;
      for(let v=first; v<=o.value+span; v+=tick){
        if(v<o.min-1e-9||v>o.max+1e-9)continue;
        const x=cx+(v-o.value)*p;
        const major=Math.abs(v/(tick*5)-Math.round(v/(tick*5)))<1e-6;
        const zero=Math.abs(v-(o.center!=null?o.center:o.min))<1e-6;
        g.globalAlpha=zero?1:(major?.75:.32);
        g.fillStyle='#fff';
        const hh=zero?24:(major?16:9), ww=zero?2:1;
        g.fillRect(x-ww/2,H/2-hh/2+4,ww,hh);
      }
      g.globalAlpha=1;
    }
    g.fillStyle='#fff'; g.fillRect(cx-1,4,2,o.list?28:22);
    g.font='500 13px "Noto Sans KR",sans-serif';
    g.fillText(o.label(),cx,H-5);
  }
  cv.addEventListener('pointerdown',e=>{if(!o)return;cv.setPointerCapture(e.pointerId);drag={x:e.clientX,v:o.list?o.idx:o.value};});
  cv.addEventListener('pointermove',e=>{
    if(!drag||!o)return;
    const dv=(e.clientX-drag.x)/upp();
    if(o.list){
      const ni=clamp(drag.v-dv,0,o.list.length-1);
      const changed=Math.round(ni)!==Math.round(o.idx);
      o.idx=ni; draw();
      if(changed){o.onInput&&o.onInput(Math.round(ni));if(navigator.vibrate)navigator.vibrate(3);}
    }else{
      const nv=clamp(Math.round((drag.v+dv)/o.step)*o.step,o.min,o.max);
      if(nv!==o.value){o.value=+nv.toFixed(4);draw();o.onInput&&o.onInput(o.value);if(navigator.vibrate)navigator.vibrate(3);}
    }
  });
  const up=()=>{if(drag&&o&&o.list){o.idx=Math.round(o.idx);draw();o.onInput&&o.onInput(o.idx);}drag=null;};
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,up));
  return {set(opt){o=opt;if(o.list&&o.idx==null)o.idx=o.value||0;size();},clear(){o=null;draw();},refresh:draw,size};
}
const camDial=Dial($('#evDial')), editDial=Dial($('#editDial'));

/* ================= 카메라 ================= */
async function start(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:2560},height:{ideal:2560}},audio:false});
    $('#v').srcObject=stream; track=stream.getVideoTracks()[0];
    caps=(track.getCapabilities?track.getCapabilities():null)||{};
    $('#err').classList.add('hide');
    setupZoom(); buildLens(); setupExposure(); applyPreview();
  }catch(e){
    $('#err').classList.remove('hide');
    $('#err').innerHTML='카메라를 열 수 없습니다.<br>브라우저의 카메라 권한을 허용해 주세요.<br><small style="opacity:.6">'+e.name+'</small>';
  }
}
function layout(){
  const {pw,ph}=dims(), f=$('#frame'), st=$('#camStage');
  const mw=st.clientWidth-8, mh=st.clientHeight-8;
  if(mw>0&&mh>0){
    let w=mw, h=w*ph/pw; if(h>mh){h=mh;w=h*pw/ph;}
    f.style.width=w+'px'; f.style.height=h+'px';
  }
  $('#gridLines').innerHTML='<i style="left:33.3%;top:0;width:1px;height:100%"></i><i style="left:66.6%;top:0;width:1px;height:100%"></i><i style="top:33.3%;left:0;height:1px;width:100%"></i><i style="top:66.6%;left:0;height:1px;width:100%"></i>';
  fitTo($('#editStage'),$('#wrap'),$('#pv'));
  fitTo($('#capStage'),$('#wrap2'),$('#pv2'));
}
function fitTo(st,wrap,c){
  if(!c.width)return;
  const mw=st.clientWidth-8, mh=st.clientHeight-8; if(mw<=0||mh<=0)return;
  let w=mw, h=w*c.height/c.width; if(h>mh){h=mh;w=h*c.width/c.height;}
  wrap.style.width=w+'px'; wrap.style.height=h+'px';
}

const swBright=()=>hwEV?1:Math.pow(2,camEV*0.5);
function setupExposure(){
  const c=caps.exposureCompensation; hwEV=!!c; camEV=0;
  const min=hwEV?c.min:-2, max=hwEV?c.max:2, step=hwEV?(c.step||.1):.1;
  if(hwEV&&track) track.applyConstraints({advanced:[{exposureCompensation:0}]}).catch(()=>{});
  camDial.set({min,max,step,value:0,center:0,
    label:()=>'노출 '+(camEV>0?'+':'')+(+camEV).toFixed(1)+' EV',
    onInput:v=>{camEV=v;applyEV();}});
}
function applyEV(){
  if(hwEV&&track) track.applyConstraints({advanced:[{exposureCompensation:camEV}]}).catch(()=>{});
  applyPreview();
}
function applyPreview(){
  const v=$('#v');
  v.style.transform=(facing==='user'?'scaleX(-1) ':'')+(nativeZoom?'':'scale('+camZoom+')');
  v.style.filter=hwEV?'none':'brightness('+swBright().toFixed(3)+')';
}

/* ---- 줌 : 핀치 + 렌즈 버튼 ---- */
function setupZoom(){
  const z=caps.zoom;
  if(z){nativeZoom=true;zUnit=(z.min>=50)?100:1;zMin=z.min/zUnit;zMax=z.max/zUnit;}
  else {nativeZoom=false;zUnit=1;zMin=1;zMax=4;}
  camZoom=clamp(1,zMin,zMax); applyZoom();
}
function applyZoom(){
  $('#zLabel').textContent='×'+(camZoom<10?camZoom.toFixed(1):camZoom.toFixed(0));
  if(nativeZoom&&track&&caps.zoom) track.applyConstraints({advanced:[{zoom:clamp(camZoom*zUnit,caps.zoom.min,caps.zoom.max)}]}).catch(()=>{});
  applyPreview();
  $$('#lensRow button').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.z-camZoom)<0.05));
}
function buildLens(){
  const row=$('#lensRow'); row.innerHTML='';
  let cand=[0.5,0.6,1,2,3,5,10].filter(v=>v>=zMin-1e-6&&v<=zMax+1e-6);
  if(!cand.length) cand=[1];
  cand.forEach(v=>{
    const b=document.createElement('button'); b.dataset.z=v;
    b.textContent=(v<1?v.toFixed(1):v)+'×';
    b.onclick=()=>{camZoom=v;applyZoom();};
    row.append(b);
  });
  applyZoom();
}
const tdist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
let pinch=null;
const fr=$('#frame');
fr.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch={d:tdist(e),z:camZoom};},{passive:true});
fr.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){camZoom=clamp(pinch.z*(tdist(e)/pinch.d),zMin,zMax);applyZoom();}},{passive:true});

$('#shot').onclick=()=>{
  if(!track)return;

  const {pw,ph}=dims(), v=$('#v');

/* ================= 그레인 / 비네팅 ================= */
let noiseTile=null;
function noise(){
  if(noiseTile)return noiseTile;
  const n=document.createElement('canvas');n.width=n.height=160;
  const g=n.getContext('2d'),d=g.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=180+Math.random()*150;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);return noiseTile=n;
}
function grain(g,w,h,a){if(a<=0)return;g.save();g.globalAlpha=a;g.globalCompositeOperation='overlay';g.fillStyle=g.createPattern(noise(),'repeat');g.fillRect(0,0,w,h);g.restore();}
function vignette(g,w,h,a){
  if(a<=0)return;
  const r=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.28,w/2,h/2,Math.max(w,h)*.72);
  r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,'+a+')');
  g.save();g.globalCompositeOperation='multiply';g.fillStyle=r;g.fillRect(0,0,w,h);g.restore();
}

/* ================= 필터 ================= */
const PRESETS={
  ORIGINAL:{},
  FILM   :{f:'saturate(1.12) contrast(1.06) brightness(1.03) sepia(.12)',fade:.06,grain:.12},
  CINEMA :{f:'contrast(1.20) saturate(.92) brightness(.98)',teal:.30,warm:.12,vig:.32},
  MONO   :{f:'grayscale(1) contrast(1.20) brightness(1.03)',grain:.14,vig:.18},
  VINTAGE:{f:'sepia(.34) saturate(.88) contrast(.92) brightness(1.07)',fade:.10,vig:.26,grain:.08},
  COOL   :{f:'saturate(1.06) contrast(1.08)',cool:.30}
};
const FXKEYS=Object.keys(PRESETS);
const scaleFilter=(str,a)=>str.replace(/([a-z-]+)\(([-\d.]+)(%|deg)?\)/g,(m,fn,v,u)=>{
  const neutral=(fn==='sepia'||fn==='grayscale'||fn==='hue-rotate')?0:1;
  return fn+'('+(neutral+(+v-neutral)*a).toFixed(3)+(u||'')+')';
});

/* ================= 사진 레이어 ================= */
const off=document.createElement('canvas');
function photoLayer(pw,ph){
  off.width=pw; off.height=ph;
  const g=off.getContext('2d');
  const z=adj.z/100, sw=shot.width/z, sh=shot.height/z;
  const sx=clamp(panX*(shot.width-sw),0,shot.width-sw), sy=clamp(panY*(shot.height-sh),0,shot.height-sh);
  const p=PRESETS[fx]||{}, amt=adj.fxAmt/100;
  const lift=wbLift(5500+adj.t*70)*tintLift(adj.ti);
  g.filter='brightness('+((100+adj.b)/100*lift).toFixed(3)+') contrast('+(100+adj.c)+'%) saturate('+(100+adj.s)+'%)'+(p.f&&amt>0?' '+scaleFilter(p.f,amt):'');
  g.drawImage(shot,sx,sy,sw,sh,0,0,pw,ph);
  g.filter='none';
  if(adj.t) paint(g,pw,ph,wbColor(5500+adj.t*70),'multiply');
  if(adj.ti) paint(g,pw,ph,tintColor(adj.ti),'multiply');
  if(p.teal) paint(g,pw,ph,'rgba(0,90,130,'+(p.teal*amt).toFixed(3)+')','soft-light');
  if(p.warm) paint(g,pw,ph,'rgba(255,160,70,'+(p.warm*amt).toFixed(3)+')','soft-light');
  if(p.cool) paint(g,pw,ph,'rgba(70,150,255,'+(p.cool*amt).toFixed(3)+')','soft-light');
  if(p.fade) paint(g,pw,ph,'rgba(255,255,255,'+(p.fade*amt).toFixed(3)+')','source-over');
  vignette(g,pw,ph,(p.vig?p.vig*amt:0)+adj.vig/100*.55);
  grain(g,pw,ph,(p.grain?p.grain*amt:0)+adj.grain/100*.25);
  return off;
}

/* ================= 폴라로이드 하단 (멘트 영역) ================= */
function metaText(){
  const n=shotTime, p=x=>String(x).padStart(2,'0'), a=[];
  if(metaOn.date) a.push(n.getFullYear()+'.'+p(n.getMonth()+1)+'.'+p(n.getDate()));
  if(metaOn.time) a.push(p(n.getHours())+':'+p(n.getMinutes()));
  if(metaOn.wx) a.push(wx?wx.icon+' '+wx.temp+'°C':wxIcon);
  return a.join('   ');
}
function wrapText(g,text,maxW){
  let lines=[],line='';
  for(const ch of [...text]){const t=line+ch;if(g.measureText(t).width>maxW&&line){lines.push(line);line=ch;}else line=t;}
  if(line)lines.push(line);
  return lines.slice(0,3);
}
function capFontSpec(){
  const s=[.8,1,1.3][capSize];
  return capFont==='hand'
    ? {f:'400 '+Math.round(96*s)+'px "Nanum Pen Script", cursive', lh:92*s}
    : {f:'500 '+Math.round(52*s)+'px "Noto Sans KR", sans-serif', lh:64*s};
}
/* 하단 여백 좌표계(0..W, 0..BOT)에 메타 → 텍스트 → 펜 순서로 겹쳐 그린다 */
function memoContent(g,W,guide){
  const m=metaText();
  if(m){g.textAlign='center';g.textBaseline='alphabetic';g.font='400 34px "Noto Sans KR", sans-serif';g.fillStyle='#555';g.fillText(m,W/2,BOT-64);}
  const txt=capText.trim();
  if(txt){
    const {f,lh}=capFontSpec();
    g.font=f; g.fillStyle='#111'; g.textAlign='center'; g.textBaseline='middle';
    const lines=wrapText(g,txt,W-PAD*2), top=capY*BOT-lines.length*lh/2;
    lines.forEach((l,i)=>g.fillText(l,capX*W,top+lh*(i+.5)));
    g.textBaseline='alphabetic';
  }else if(guide&&!strokes.length){
    g.font='400 36px "Noto Sans KR", sans-serif';g.fillStyle='#bbb';g.textAlign='center';g.textBaseline='middle';
    g.fillText('여기에 멘트를 남겨 주세요 (텍스트 · 펜)',W/2,BOT*.4);g.textBaseline='alphabetic';
  }
  if(penLayer) g.drawImage(penLayer,0,0);
}
function compose(c,src){
  const {pw,ph}=dims(), W=pw+PAD*2;
  c.width=W; c.height=ph+PAD+BOT;
  const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(src,PAD,PAD);
  g.strokeStyle='rgba(0,0,0,.12)'; g.lineWidth=2; g.strokeRect(PAD,PAD,pw,ph);
  g.save(); g.translate(0,PAD+ph); memoContent(g,W,false); g.restore();
}
function renderAdj(){
  if(!shot)return;
  const {pw,ph}=dims();
  compose($('#pv'),photoLayer(pw,ph));
  layout();
}
let raf=0;
const scheduleCap=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderCap();});};
function renderCap(){
  if(!baked)return;
  const {pw}=dims(), W=pw+PAD*2, m=$('#memo');
  if(m.width!==W||m.height!==BOT){m.width=W;m.height=BOT;}
  const g=m.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,W,BOT);
  memoContent(g,W,true);
  g.save(); g.strokeStyle='rgba(0,0,0,.18)'; g.setLineDash([10,8]); g.lineWidth=2; g.strokeRect(1,1,W-2,BOT-2); g.restore();
  compose($('#pv2'),baked);
  layout();
}

function drawStroke(g,s){
  g.save();
  g.globalCompositeOperation=s.e?'destination-out':'source-over';
  g.strokeStyle=g.fillStyle=s.c; g.lineWidth=s.w; g.lineCap=g.lineJoin='round';
  if(s.p.length===1){g.beginPath();g.arc(s.p[0][0],s.p[0][1],s.w/2,0,7);g.fill();}
  else{g.beginPath();s.p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();}
  g.restore();
}
function repaintPen(){
  const g=penLayer.getContext('2d'); g.clearRect(0,0,penLayer.width,penLayer.height);
  strokes.forEach(s=>drawStroke(g,s));
}
function hasInk(){
  if(!penLayer||!strokes.some(s=>!s.e))return false;
  const d=penLayer.getContext('2d').getImageData(0,0,penLayer.width,penLayer.height).data;
  for(let i=3;i<d.length;i+=4) if(d[i]>40) return true;
  return false;
}

const memo=$('#memo');
let cur=null, tdrag=null;
const mpt=e=>{const r=memo.getBoundingClientRect();return[(e.clientX-r.left)*memo.width/r.width,(e.clientY-r.top)*memo.height/r.height];};
memo.addEventListener('pointerdown',e=>{
  e.preventDefault(); memo.setPointerCapture(e.pointerId);
  if(tool==='text'){ if(capText.trim()) tdrag={x:e.clientX,y:e.clientY,cx:capX,cy:capY}; return; }
  cur={c:penColor,w:tool==='erase'?eraseW:penW,e:tool==='erase',p:[mpt(e)]};
  strokes.push(cur); repaintPen(); scheduleCap();
});
memo.addEventListener('pointermove',e=>{
  if(tdrag){
    const r=memo.getBoundingClientRect();
    capX=clamp(tdrag.cx+(e.clientX-tdrag.x)/r.width,.05,.95);
    capY=clamp(tdrag.cy+(e.clientY-tdrag.y)/r.height,.1,.9);
    scheduleCap(); return;
  }
  if(cur){cur.p.push(mpt(e));repaintPen();scheduleCap();}
});
['pointerup','pointercancel'].forEach(ev=>memo.addEventListener(ev,()=>{cur=null;tdrag=null;}));

$('#mTime').onclick=e=>{metaOn.time=!metaOn.time;e.currentTarget.classList.toggle('on',metaOn.time);scheduleCap();};
$('#mWx').onclick=e=>{metaOn.wx=!metaOn.wx;e.currentTarget.classList.toggle('on',metaOn.wx);if(metaOn.wx&&!wx)getWx();scheduleCap();};
$('#mIcon').onclick=e=>{wxIcon=ICONS[(ICONS.indexOf(wxIcon)+1)%ICONS.length];e.currentTarget.textContent=wxIcon;scheduleCap();toast('날씨 아이콘 (자동 수신 시 대체됨)');};
const WMO=c=>c===0?'☀':c<3?'⛅':c<45?'☁':c<50?'🌫':c<60?'🌦':c<70?'☂':c<80?'❄':c<83?'🌧':c<87?'🌨':'⛈';
function getWx(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.coords.latitude.toFixed(3)+'&longitude='+p.coords.longitude.toFixed(3)+'&current=temperature_2m,weather_code');
      const j=await r.json();
      wx={temp:Math.round(j.current.temperature_2m),icon:WMO(j.current.weather_code)};
      scheduleCap();
    }catch(_){}
  },()=>{},{timeout:8000,maximumAge:600000});
}

/* ================= 확정 → 저장 → 다운로드 ================= */
$('#capOk').onclick=async()=>{
  if(!capText.trim()&&!hasInk()){toast('멘트를 남겨야 확정할 수 있어요 (텍스트 또는 펜)');return;}
  const ok=await askModal({title:'사진을 확정할까요?',msg:'확정하면 보정과 멘트를 더 이상 수정할 수 없어요.',ok:'확정'});
  if(!ok)return;
  const c=document.createElement('canvas'); compose(c,baked);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.93));
  const rec={id:'p'+Date.now(),ts:Date.now(),blob};
  let saved=true;
  try{await dbPut(rec);}catch(e){saved=false;}
  shot=null; baked=null; penLayer=null; strokes=[];
  showOut(rec,'done');
  if(!saved) toast('앨범 저장에 실패했어요. 지금 바로 다운로드해 주세요');
};

let outUrl=null, outRec=null;
function showOut(rec,mode){
  outRec=rec;
  if(outUrl)URL.revokeObjectURL(outUrl);
  outUrl=URL.createObjectURL(rec.blob);
  $('#outImg').src=outUrl;
  const done=mode==='done';
  $('#outSteps').classList.toggle('hide',!done);
  $('#oAlbum').classList.toggle('hide',!done);
  $('#home').classList.toggle('hide',!done);
  $('#oBack').classList.toggle('hide',done);
  $('#del').classList.toggle('hide',done);
  const d=new Date(rec.ts), p=x=>String(x).padStart(2,'0');
  $('#outHint').innerHTML=(done?'확정 완료 · 앨범에 저장됐어요.<br>':(d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+' 확정된 사진 · 수정할 수 없어요<br>'))+'다운로드가 안 되면 사진을 길게 눌러 <b>이미지 저장</b>을 선택하세요.';
  show('out');
}
$('#dl').onclick=()=>{
  if(!outRec)return;
  const u=URL.createObjectURL(outRec.blob), a=document.createElement('a');
  a.href=u; a.download='polaroid_'+outRec.ts+'.jpg'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast('다운로드');
};
$('#oAlbum').onclick=openAlbum;
$('#oBack').onclick=openAlbum;
$('#home').onclick=goHome;
$('#aBack').onclick=goHome;
$('#del').onclick=async()=>{
  if(!outRec)return;
  const ok=await askModal({title:'사진을 삭제할까요?',msg:'앨범에서 삭제하면 되돌릴 수 없어요.',ok:'삭제'});
  if(!ok)return;
  try{await dbDel(outRec.id);toast('삭제했습니다');}catch(e){toast('삭제에 실패했어요');}
  openAlbum();
};

/* ================= 앨범 ================= */
let albumUrls=[];
async function openAlbum(){
  show('album');
  const grid=$('#albumGrid'); grid.innerHTML='';
  albumUrls.forEach(u=>URL.revokeObjectURL(u)); albumUrls=[];
  let list=[]; try{list=await dbAll();}catch(e){toast('앨범을 불러올 수 없어요');}
  list.sort((a,b)=>b.ts-a.ts);
  $('#albumCount').textContent='앨범 · '+list.length+'장';
  $('#albumEmpty').classList.toggle('hide',list.length>0);
  grid.classList.toggle('hide',!list.length);
  list.forEach(rec=>{
    const u=URL.createObjectURL(rec.blob); albumUrls.push(u);
    const im=document.createElement('img'); im.src=u; im.loading='lazy';
    im.onclick=()=>showOut(rec,'album');
    grid.append(im);
  });
}

function goHome(){
  shot=null; baked=null; resetEditState();
  if(outUrl){URL.revokeObjectURL(outUrl);outUrl=null;} outRec=null;
  $('#outImg').removeAttribute('src');
  show('cam');
}

/* ================= init ================= */
addEventListener('resize',()=>{layout();camDial.size();editDial.size();});
updateCount(); layout(); start();
if(document.fonts){
  document.fonts.load('96px "Nanum Pen Script"','가').catch(()=>{});
  document.fonts.ready.then(()=>{if(!$('#edit').classList.contains('hide'))renderAdj();if(!$('#capv').classList.contains('hide'))renderCap();});
}
</script>
